<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Makes the page display correctly on different devices -->
    <meta charset="UTF-8">

    <!-- Makes the website responsive on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Text shown in the browser tab -->
    <title>UniAble | Inclusion Starts With Access</title>

    <!-- Connect our CSS file -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!--
        MAIN APPLICATION CONTAINER

        Everything belonging to the UniAble landing page
        will live inside this container.
    -->
    <main class="app">

        <!-- BRANDING -->
        <section class="brand">

            <div class="logo">
                🎓
            </div>

            <h1>UniAble</h1>

            <p>Inclusion Starts With Access</p>

        </section>


        <!-- ACTION BUTTONS -->
        <section class="actions">

            <button
                class="primary-button"
                id="voiceSignupButton"
            >
                🎤 Voice Sign-Up
                <span>(New Student)</span>
            </button>


            <button
                class="secondary-button"
                id="voiceLoginButton"
            >
                🔊 Voice Login
                <span>(Returning Student)</span>
            </button>


            <button
                class="email-button"
                id="emailLoginButton"
            >
                Login with Email
            </button>


            <button
                class="guest-button"
                id="guestButton"
            >
                Continue as Guest
            </button>

        </section>


        <!-- ACCESSIBILITY INFORMATION -->
        <section class="language-card">

            <div class="language-icon">
                🌐
            </div>

            <div>
                <strong>11 South African languages</strong>

                <p>
                    Fully voice-guided for blind &
                    low-vision students
                </p>
            </div>

        </section>


        <!-- HEY UNIABLE -->
        <section class="voice-card">

            <div class="voice-icon">
                ✨
            </div>

            <div>
                <strong>Say “Hey UniAble” anytime</strong>

                <p>
                    Works system-wide, even before you sign up
                </p>
            </div>

        </section>


        <!-- ACCESSIBILITY MESSAGE -->
        <p class="accessibility-message">
            ♿ Designed for accessible, independent learning
        </p>

    </main>


    <!-- Connect JavaScript -->
    <script src="script.js"></script>

</body>
</html>
